server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/public-stats {
        proxy_pass https://api.norisk.gg/api/v1/core/stats/uniquePlayers24h;
        proxy_set_header Host api.norisk.gg;
        proxy_ssl_server_name on;
    }

    location = /api/news {
        proxy_pass https://blog.norisk.gg/wp-json/wp/v2/posts?categories=21%2C2&per_page=10&page=1;
        proxy_set_header Host blog.norisk.gg;
        proxy_ssl_server_name on;
    }

    location = /skins/SirKnubble.png {
        proxy_pass https://mc-heads.net/skin/SirKnubble;
        proxy_ssl_server_name on;
    }
    location = /avatars/SirKnubble.png {
        proxy_pass https://mc-heads.net/avatar/SirKnubble/64;
        proxy_ssl_server_name on;
    }
    location = /body/SirKnubble.png {
        proxy_pass https://mc-heads.net/body/SirKnubble/600;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
